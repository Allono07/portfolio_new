<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Why radius alerts create false positives</title><desc id="desc">A vehicle on Lane 4 approaches User A. A translucent proximity circle also includes User B on Lane 3 and User C on Lane 5. A receives a correct alert; B and C are false positives.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#246346" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="650" fill="#F7F7F2"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><text x="42" y="48" font-size="32" fill="#202922" font-weight="700" text-anchor="start">One radius. Three roads.</text><line x1="150" y1="190" x2="1110" y2="190" stroke="#D9DEDA" stroke-width="52" stroke-linecap="round"/><line x1="150" y1="190" x2="1110" y2="190" stroke="#ABB5AC" stroke-width="2" stroke-dasharray="12 12"/><text x="42" y="198" font-size="24" fill="#657068" font-weight="600" text-anchor="start">Lane 3</text><line x1="150" y1="320" x2="1110" y2="320" stroke="#D9DEDA" stroke-width="52" stroke-linecap="round"/><line x1="150" y1="320" x2="1110" y2="320" stroke="#ABB5AC" stroke-width="2" stroke-dasharray="12 12"/><text x="42" y="328" font-size="24" fill="#657068" font-weight="600" text-anchor="start">Lane 4</text><line x1="150" y1="450" x2="1110" y2="450" stroke="#D9DEDA" stroke-width="52" stroke-linecap="round"/><line x1="150" y1="450" x2="1110" y2="450" stroke="#ABB5AC" stroke-width="2" stroke-dasharray="12 12"/><text x="42" y="458" font-size="24" fill="#657068" font-weight="600" text-anchor="start">Lane 5</text><circle cx="540" cy="320" r="235" fill="#246346" fill-opacity="0.08" stroke="#73937C" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(540 320)"><rect x="-28" y="-20" width="54" height="40" rx="9" fill="#246346" stroke="none" /><rect x="9" y="-13" width="10" height="26" rx="3" fill="#DCE9DE" stroke="none" /><rect x="-19" y="-25" width="13" height="6" rx="2" fill="#202922" stroke="none" /><rect x="-19" y="19" width="13" height="6" rx="2" fill="#202922" stroke="none" /></g><line x1="582" y1="320" x2="677" y2="320" stroke="#246346" stroke-width="4" marker-end="url(#arrow)"/><text x="540" y="272" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">BBMP Auto</text><circle cx="665" cy="190" r="19" fill="#F7F7F2" stroke="#A64F43" stroke-width="3"/><text x="665" y="197" font-size="20" fill="#A64F43" font-weight="700" text-anchor="middle">B</text><text x="660" y="150" font-size="23" fill="#202922" font-weight="600" text-anchor="middle">User B</text><rect x="850" y="168" width="235" height="44" rx="22" fill="#F3E7DF" stroke="none" /><text x="967" y="197" font-size="22" fill="#A64F43" font-weight="600" text-anchor="middle">False positive</text><circle cx="735" cy="320" r="19" fill="#F7F7F2" stroke="#246346" stroke-width="3"/><text x="735" y="327" font-size="20" fill="#246346" font-weight="700" text-anchor="middle">A</text><text x="730" y="280" font-size="23" fill="#202922" font-weight="600" text-anchor="middle">User A</text><rect x="850" y="298" width="235" height="44" rx="22" fill="#E3EDE2" stroke="none" /><text x="967" y="327" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">Correct alert</text><circle cx="665" cy="450" r="19" fill="#F7F7F2" stroke="#A64F43" stroke-width="3"/><text x="665" y="457" font-size="20" fill="#A64F43" font-weight="700" text-anchor="middle">C</text><text x="660" y="410" font-size="23" fill="#202922" font-weight="600" text-anchor="middle">User C</text><rect x="850" y="428" width="235" height="44" rx="22" fill="#F3E7DF" stroke="none" /><text x="967" y="457" font-size="22" fill="#A64F43" font-weight="600" text-anchor="middle">False positive</text><text x="42" y="605" font-size="25" fill="#202922" font-weight="600" text-anchor="start">Inside the circle does not mean on the collection road.</text></g></svg>