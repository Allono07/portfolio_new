<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">A worked coordinate example: distance versus road context</title>
<desc id="desc">Synthetic local map with north upwards. Vehicle: 12.9716000, 77.5946000. A: 12.9716000, 77.5951537, about 60 metres east. B: 12.9719148, 77.5946000, about 35 metres north. Both pass an example 100-metre radius. Only A shares the illustrated vehicle road, Lane 4. Road associations are hypothetical, not measured.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#246346" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="850" fill="#F7F7F2"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><text x="42" y="49" font-size="32" fill="#202922" font-weight="700" text-anchor="start">Same coordinates. Different decisions.</text><text x="42" y="86" font-size="21" fill="#657068" font-weight="400" text-anchor="start">Synthetic local map · north ↑ · east →</text><line x1="150" y1="185" x2="1110" y2="185" stroke="#D9DEDA" stroke-width="52" stroke-linecap="round"/><line x1="150" y1="185" x2="1110" y2="185" stroke="#ABB5AC" stroke-width="2" stroke-dasharray="12 12"/><text x="42" y="193" font-size="24" fill="#657068" font-weight="600" text-anchor="start">Lane 3</text><line x1="150" y1="360" x2="1110" y2="360" stroke="#D9DEDA" stroke-width="52" stroke-linecap="round"/><line x1="150" y1="360" x2="1110" y2="360" stroke="#ABB5AC" stroke-width="2" stroke-dasharray="12 12"/><text x="42" y="368" font-size="24" fill="#657068" font-weight="600" text-anchor="start">Lane 4</text><g transform="translate(460 360)"><rect x="-28" y="-20" width="54" height="40" rx="9" fill="#246346" stroke="none"/><rect x="9" y="-13" width="10" height="26" rx="3" fill="#DCE9DE" stroke="none"/><rect x="-19" y="-25" width="13" height="6" rx="2" fill="#202922" stroke="none"/><rect x="-19" y="19" width="13" height="6" rx="2" fill="#202922" stroke="none"/></g><circle cx="760" cy="360" r="19" fill="#F7F7F2" stroke="#246346" stroke-width="3"/><text x="760" y="367" font-size="20" fill="#246346" font-weight="700" text-anchor="middle">A</text><circle cx="460" cy="185" r="19" fill="#F7F7F2" stroke="#A64F43" stroke-width="3"/><text x="460" y="192" font-size="20" fill="#A64F43" font-weight="700" text-anchor="middle">B</text><text x="460" y="129" font-size="23" fill="#202922" font-weight="600" text-anchor="middle">User B</text><text x="460" y="155" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">12.9719148, 77.5946000</text><text x="800" y="310" font-size="23" fill="#202922" font-weight="600" text-anchor="start">User A</text><text x="800" y="338" font-size="19" fill="#657068" font-weight="400" text-anchor="start">12.9716000, 77.5951537</text><line x1="503" y1="360" x2="725" y2="360" stroke="#246346" stroke-width="3" marker-end="url(#arrow)"/><text x="616" y="402" font-size="23" fill="#246346" font-weight="600" text-anchor="middle">60 m ahead</text><line x1="390" y1="185" x2="390" y2="360" stroke="#A64F43" stroke-width="2" stroke-dasharray="6 5"/><line x1="384" y1="185" x2="396" y2="185" stroke="#A64F43" stroke-width="2" /><line x1="384" y1="360" x2="396" y2="360" stroke="#A64F43" stroke-width="2" /><text x="374" y="279" font-size="23" fill="#A64F43" font-weight="600" text-anchor="end">35 m</text><text x="460" y="445" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">Vehicle GPS</text><text x="460" y="473" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">12.9716000, 77.5946000</text><line x1="975" y1="451" x2="1075" y2="451" stroke="#202922" stroke-width="3" /><line x1="975" y1="445" x2="975" y2="457" stroke="#202922" stroke-width="2" /><line x1="1075" y1="445" x2="1075" y2="457" stroke="#202922" stroke-width="2" /><text x="1025" y="481" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">20 m</text><rect x="40" y="525" width="540" height="255" rx="14" fill="#FFFFFF" stroke="#D5DCD4"/><rect x="620" y="525" width="540" height="255" rx="14" fill="#E3EDE2" stroke="#AAC0AA"/><text x="68" y="568" font-size="20" fill="#657068" font-weight="700" text-anchor="start">DISTANCE ONLY · EXAMPLE RADIUS 100 m</text><text x="68" y="617" font-size="24" fill="#202922" font-weight="600" text-anchor="start">A: 60 m ≤ 100 m → candidate</text><text x="68" y="661" font-size="24" fill="#202922" font-weight="600" text-anchor="start">B: 35 m ≤ 100 m → candidate</text><text x="68" y="742" font-size="21" fill="#657068" font-weight="400" text-anchor="start">Closer does not mean on the right road.</text><text x="648" y="568" font-size="20" fill="#246346" font-weight="700" text-anchor="start">ROAD CONTEXT · PROPOSED</text><text x="648" y="617" font-size="24" fill="#202922" font-weight="600" text-anchor="start">Vehicle → Lane 4</text><text x="648" y="661" font-size="21" fill="#202922" font-weight="400" text-anchor="start">A pickup → Lane 4    ·    B pickup → Lane 3</text><text x="648" y="742" font-size="25" fill="#246346" font-weight="700" text-anchor="start">A is the relevant candidate.</text><text x="42" y="822" font-size="19" fill="#657068" font-weight="400" text-anchor="start">Illustrative roads, not surveyed map data · distances rounded by geolib</text></g></svg>