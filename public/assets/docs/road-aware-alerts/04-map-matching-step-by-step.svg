<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
<title id="title">Map matching step by step with illustrative costs</title><desc id="desc">Three GPS observations each have a candidate on Lane 3 and Lane 4. The middle observation is nearer Lane 3. Costs combine squared GPS offsets and assumed road-transition penalties. Evaluating all eight sequences selects Lane 4 throughout, at cost 2.810, despite the noisy middle observation. These teaching values are not Meili configuration or measured results.</desc>
<rect width="1200" height="1220" fill="#F7F7F2"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><text x="40" y="48" font-size="32" fill="#202922" font-weight="700" text-anchor="start">How a GPS trace becomes a road match</text><text x="40" y="84" font-size="21" fill="#657068" font-weight="400" text-anchor="start">Illustrative scoring model · lower cost wins · not actual Meili output</text><text x="40" y="132" font-size="24" fill="#202922" font-weight="700" text-anchor="start">1  Find candidate road positions for each GPS observation</text><line x1="240" y1="190" x2="1110" y2="190" stroke="#D9DEDA" stroke-width="32" stroke-linecap="round"/><text x="40" y="198" font-size="23" fill="#657068" font-weight="600" text-anchor="start">Lane 3</text><line x1="240" y1="295" x2="1110" y2="295" stroke="#D9DEDA" stroke-width="32" stroke-linecap="round"/><text x="40" y="303" font-size="23" fill="#657068" font-weight="600" text-anchor="start">Lane 4</text><polyline points="350,283 650,232 950,280" fill="none" stroke="#57645D" stroke-width="2" stroke-dasharray="6 6"/><line x1="350" y1="190" x2="350" y2="295" stroke="#9DA99F" stroke-width="2" stroke-dasharray="4 5"/><circle cx="350" cy="190" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="350" cy="295" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="350" cy="283" r="8" fill="#202922"/><text x="350" y="340" font-size="21" fill="#202922" font-weight="600" text-anchor="middle">GPS 1</text><line x1="650" y1="190" x2="650" y2="295" stroke="#9DA99F" stroke-width="2" stroke-dasharray="4 5"/><circle cx="650" cy="190" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="650" cy="295" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="650" cy="232" r="8" fill="#202922"/><text x="650" y="340" font-size="21" fill="#202922" font-weight="600" text-anchor="middle">GPS 2</text><line x1="950" y1="190" x2="950" y2="295" stroke="#9DA99F" stroke-width="2" stroke-dasharray="4 5"/><circle cx="950" cy="190" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="950" cy="295" r="7" fill="#F7F7F2" stroke="#246346" stroke-width="2"/><circle cx="950" cy="280" r="8" fill="#202922"/><text x="950" y="340" font-size="21" fill="#202922" font-weight="600" text-anchor="middle">GPS 3</text><text x="650" y="376" font-size="21" fill="#A64F43" font-weight="600" text-anchor="middle">Point 2 is closer to Lane 3. Does the whole journey agree?</text><line x1="40" y1="402" x2="1160" y2="402" stroke="#D5DCD4" stroke-width="2" /><text x="40" y="446" font-size="24" fill="#202922" font-weight="700" text-anchor="start">2  Score candidates and possible road transitions</text><text x="40" y="482" font-size="21" fill="#657068" font-weight="400" text-anchor="start">Example: E = ½ × (GPS offset / 10 m)²; transition costs T are assumed below.</text><text x="350" y="525" font-size="21" fill="#657068" font-weight="600" text-anchor="middle">t1</text><text x="650" y="525" font-size="21" fill="#657068" font-weight="600" text-anchor="middle">t2</text><text x="950" y="525" font-size="21" fill="#657068" font-weight="600" text-anchor="middle">t3</text><line x1="440" y1="580" x2="560" y2="580" stroke="#AAB4AB" stroke-width="2" /><line x1="440" y1="580" x2="560" y2="730" stroke="#AAB4AB" stroke-width="2" stroke-dasharray="5 5"/><line x1="440" y1="730" x2="560" y2="580" stroke="#AAB4AB" stroke-width="2" stroke-dasharray="5 5"/><line x1="440" y1="730" x2="560" y2="730" stroke="#246346" stroke-width="4" /><rect x="464.0" y="638" width="72" height="32" rx="12" fill="#F7F7F2" stroke="none"/><text x="500.0" y="661" font-size="18" fill="#A64F43" font-weight="600" text-anchor="middle">T = 6</text><text x="500.0" y="555" font-size="17" fill="#657068" font-weight="400" text-anchor="middle">T = 0.2</text><text x="500.0" y="768" font-size="17" fill="#246346" font-weight="400" text-anchor="middle">T = 0.2</text><line x1="740" y1="580" x2="860" y2="580" stroke="#AAB4AB" stroke-width="2" /><line x1="740" y1="580" x2="860" y2="730" stroke="#AAB4AB" stroke-width="2" stroke-dasharray="5 5"/><line x1="740" y1="730" x2="860" y2="580" stroke="#AAB4AB" stroke-width="2" stroke-dasharray="5 5"/><line x1="740" y1="730" x2="860" y2="730" stroke="#246346" stroke-width="4" /><rect x="764.0" y="638" width="72" height="32" rx="12" fill="#F7F7F2" stroke="none"/><text x="800.0" y="661" font-size="18" fill="#A64F43" font-weight="600" text-anchor="middle">T = 6</text><text x="800.0" y="555" font-size="17" fill="#657068" font-weight="400" text-anchor="middle">T = 0.2</text><text x="800.0" y="768" font-size="17" fill="#246346" font-weight="400" text-anchor="middle">T = 0.2</text><text x="40" y="574" font-size="22" fill="#657068" font-weight="600" text-anchor="start">Lane 3</text><text x="40" y="601" font-size="19" fill="#657068" font-weight="400" text-anchor="start">candidates</text><text x="40" y="724" font-size="22" fill="#246346" font-weight="600" text-anchor="start">Lane 4</text><text x="40" y="751" font-size="19" fill="#657068" font-weight="400" text-anchor="start">candidates</text><rect x="260" y="541" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#D5DCD4"/><text x="350" y="574" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 31 m</text><text x="350" y="603" font-size="22" fill="#202922" font-weight="600" text-anchor="middle">E = 4.805</text><rect x="560" y="541" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#D5DCD4"/><text x="650" y="574" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 14 m</text><text x="650" y="603" font-size="22" fill="#202922" font-weight="600" text-anchor="middle">E = 0.980</text><rect x="860" y="541" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#D5DCD4"/><text x="950" y="574" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 30 m</text><text x="950" y="603" font-size="22" fill="#202922" font-weight="600" text-anchor="middle">E = 4.500</text><rect x="260" y="691" width="180" height="78" rx="12" fill="#E3EDE2" stroke="#88A18D"/><text x="350" y="724" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 4 m</text><text x="350" y="753" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">E = 0.080</text><rect x="560" y="691" width="180" height="78" rx="12" fill="#E3EDE2" stroke="#88A18D"/><text x="650" y="724" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 21 m</text><text x="650" y="753" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">E = 2.205</text><rect x="860" y="691" width="180" height="78" rx="12" fill="#E3EDE2" stroke="#88A18D"/><text x="950" y="724" font-size="19" fill="#657068" font-weight="400" text-anchor="middle">offset 5 m</text><text x="950" y="753" font-size="22" fill="#246346" font-weight="600" text-anchor="middle">E = 0.125</text><text x="40" y="811" font-size="20" fill="#657068" font-weight="400" text-anchor="start">Cross-road moves require a detour in this example; a real turn can have a low cost.</text><rect x="40" y="843" width="1120" height="290" rx="12" fill="#FFFFFF" stroke="#D5DCD4"/><text x="64" y="884" font-size="24" fill="#202922" font-weight="700" text-anchor="start">3  Accumulate costs, then recover the cheapest connected path</text><text x="64" y="925" font-size="22" fill="#202922" font-weight="400" text-anchor="start">best(t, road) = E(t, road) + min(previous best + transition cost)</text><text x="64" y="967" font-size="23" fill="#246346" font-weight="600" text-anchor="start">Lane 4 throughout</text><text x="615" y="967" font-size="22" fill="#246346" font-weight="600" text-anchor="start">0.080 + 2.205 + 0.125 + 0.4 = 2.810</text><text x="64" y="1010" font-size="23" fill="#202922" font-weight="400" text-anchor="start">Lane 3 throughout</text><text x="615" y="1010" font-size="22" fill="#202922" font-weight="400" text-anchor="start">4.805 + 0.980 + 4.500 + 0.4 = 10.685</text><text x="64" y="1053" font-size="23" fill="#A64F43" font-weight="400" text-anchor="start">Nearest-point choice: 4 → 3 → 4</text><text x="615" y="1053" font-size="22" fill="#A64F43" font-weight="400" text-anchor="start">0.080 + 0.980 + 0.125 + 12 = 13.185</text><text x="64" y="1103" font-size="23" fill="#246346" font-weight="700" text-anchor="start">Best of all 8 candidate sequences: Lane 4 → Lane 4 → Lane 4</text><text x="40" y="1180" font-size="23" fill="#202922" font-weight="600" text-anchor="start">Output: road context for Trash Buddy’s eligibility checks—not a notification decision.</text></g></svg>